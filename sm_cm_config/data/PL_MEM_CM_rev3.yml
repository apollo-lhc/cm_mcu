metadata:
  - name: zynqmon configuration file
  - cm_hw_rev: 3
  - sm_hw_rev: 2
  - sm_fw_rev: 2
  - revision: 1

# Bit layouts for bitfields entries, referenced below with *name.
# PMBus STATUS_WORD, from the LGA80D datasheet (Rev 3.3, p.52); bits 8 and 10 are not used.
pmbus_status_word: &pmbus_status_word
  VOUT: 0x8000
  IOUT: 0x4000
  INPUT: 0x2000
  MFR: 0x1000
  PGOOD_N: 0x0800
  OTHER: 0x0200
  BUSY: 0x0080
  "OFF": 0x0040 # quoted: YAML reads a bare OFF as false
  VOUT_OV: 0x0020
  IOUT_OC: 0x0010
  VIN_UV: 0x0008
  TEMPERATURE: 0x0004
  CML: 0x0002
  NONE_OF_ABOVE: 0x0001

# weird overwrites of address at location 0x00 so avoid that
# location, and start at 0x02 instead. Should figure this out
# eventually.
config:
  - name: firefly
    start: 2
    count: 160
    mcu_call: firefly_info
    mcu_extra_call: null
    type: uint16_t
    extra: Table=CM_FF_MON;Status=1
    default_col: null # if null, then column header
    names:
      - F1_P1_Tx12 
      - F1_P1_Rx12
      - F1_P2_Tx12 
      - F1_P2_Rx12
      - F1_P3_Tx12
      - F1_P3_Rx12 
      - F1_P4_Tx12
      - F1_P4_Rx12
      - F1_P5_XCVR4 
      - F1_P6_XCVR4
      - F2_P1_Tx12
      - F2_P1_Rx12 
      - F2_P2_Tx12 
      - F2_P2_Rx12 
      - F2_P3_Tx12 
      - F2_P3_Rx12 
      - F2_P4_Tx12
      - F2_P4_Rx12
      - F2_P5_XCVR4 
      - F2_P6_XCVR4
    postfixes: 
      - Temp_C
      - OptPow
      - TxDisabled
      - LOS_ALARM
      - CDR_LOL_ALARM
      - CDR_ENABLE
      - POWER_ALARM_R0
      - POWER_ALARM_R1
  - name: uptime
    start: 162
    count: 2
    type: uint32_t
    mcu_call: uptime
    mcu_extra_call: null
    extra: Table=CM_MON;Column=Minutes;Status=1
    default_col: null
    names:
      - MCU_UPTIME
  - name: psmon
    start: 164
    count: 84
    mcu_call: psmon
    mcu_extra_call: null
    type: fp16
    extra: Table=CM_MON;Status=2
    default_col: null
    names: 
      - 1V8
      - 3V3
      - F1VCCINT1_S1
      - F1VCCINT1_S2
      - F1VCCINT2_S1
      - F1VCCINT2_S2
      - F2VCCINT1_S1
      - F2VCCINT1_S2
      - F2VCCINT2_S1
      - F2VCCINT2_S2
      - F1AVTT
      - F1AVCC
      - F2AVTT
      - F2AVCC
    postfixes: 
      - TEMP1
      - TEMP3
      - VIN
      - VOUT
      - IOUT
      - STATUS_WORD
    # STATUS_WORD is a bit field: sent as the raw word (fp16 rounds values above 2048
    # and corrupts the low bits); 0xFFFF = no data (stale, supply off, read error).
    # postfix_types must match the PM_STATUS commands in zm_set_psmon.
    postfix_types:
      STATUS_WORD: uint16_t
    bitfields:
      STATUS_WORD:
        extra: Table=CM_MON_STATUS;Status=2
        fields: *pmbus_status_word
  - name: gitversion
    start: 248
    count: 10
    type: char
    size: 5
    mcu_call: gitversion
    mcu_extra_call: null
    default_col: null
    names:
      - MCU_FW_VER
  - name: adcmon
    start: 258
    count: 21
    mcu_call: adcmon
    mcu_extra_call: null
    default_col: ADC
    type: fp16
    extra: Table=CM_MON;Status=1
    names:
      - VCC_V120 
      - VCC_MV33
      - VCC_V33
      - VCC_V40 
      - VCC_V18
      - F1_VCCINT
      - F1_AVCC
      - F1_AVTT
      - F1_VCCAUX
      - F2_VCCINT
      - F2_AVCC 
      - F2_AVTT 
      - F2_VCCAUX
      - CUR_V_V12
      - CUR_V_MV33
      - CUR_V_V40
      - CUR_V_F1VCCAUX
      - CUR_V_F2VCCAUX
      - F1_TEMP
      - F2_TEMP
      - TM4C_TEMP
  - name: fpga
    start: 280
    count: 8
    type: fp16
    extra: Table=CM_MON;Status=2
    default_col: TEMP_C
    mcu_call: fpga
    mcu_extra_call: null
    names:
      - F1_TEMP_SLR0
      - F1_TEMP_SLR1
      - F1_TEMP_SLR2
      - F1_TEMP_SLR3
      - F2_TEMP_SLR0
      - F2_TEMP_SLR1
      - F2_TEMP_SLR2
      - F2_TEMP_SLR3
  - name: clkmon
    start: 288
    count: 35
    type: uint16_t
    extra: Table=CM_CLK_MON;Status=1
    mcu_call: clock
    mcu_extra_call: null
    default_col: null
    names: 
      - ROA
      - R0B
      - R1A
      - R1B
      - R1C
    postfixes:
      - PN_BASE
      - DEVICE_REV
      - I2C_ADDR
      - LOL
      - INT_STATUS
      - LOSOOF_IN
      - STICKY_FLG
  - name: clkr0aconfigversion
    start: 324
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 0
    names:
      - MCU_CLKR0A_VER
  - name: clkr0bconfigversion
    start: 328
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 1
    names:
      - MCU_CLKR0B_VER
  - name: clkr1aconfigversion
    start: 332
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 2
    names:
      - MCU_CLKR1A_VER
  - name: clkr1bconfigversion
    start: 336
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 3
    names:
      - MCU_CLKR1B_VER
  - name: clkr1cconfigversion
    start: 340
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 4
    names:
      - MCU_CLKR1C_VER
  - name: firefly_bits
    start: 344
    count: 8
    type: uint16_t
    extra: Table=CM_FFARGV_MON;Status=1
    default_col: null
    mcu_call: firefly_bits
    mcu_extra_call: null
    names:
      - F1_FFL12CH
      - F1_FFLDAQ
      - F2_FFL12CH
      - F2_FFLDAQ
    postfixes:
      - IS_FF25Gbs
      - IS_PRESENT      
  - name: firefly_optpow_12
    start: 352
    count: 96
    mcu_call: firefly_optpow12
    mcu_extra_call: null
    type: uint16_t
    extra: Table=CM_OPTPOW12_MON;Status=1
    default_col: null
    names:
      - FF1_P1_Rx12 
      - FF1_P2_Rx12 
      - FF1_P3_Rx12 
      - FF1_P4_Rx12 
      - FF2_P1_Rx12 
      - FF2_P2_Rx12 
      - FF2_P3_Rx12 
      - FF2_P4_Rx12
    postfixes:
      - CH0
      - CH1 
      - CH2
      - CH3
      - CH4
      - CH5
      - CH6
      - CH7
      - CH8
      - CH9
      - CH10
      - CH11
  - name: firefly_optpow_4
    start: 448
    count: 16
    mcu_call: firefly_optpow4
    mcu_extra_call: null
    type: uint16_t
    extra: Table=CM_OPTPOW4_MON;Status=1
    default_col: null
    names:
      - FF1_P5_XCVR4 
      - FF1_P6_XCVR4 
      - FF2_P5_XCVR4 
      - FF2_P6_XCVR4 
    postfixes:
      - CH0
      - CH1
      - CH2
      - CH3
