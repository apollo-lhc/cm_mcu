metadata:
  - name: zynqmon configuration file
  - cm_hw_rev: 3
  - sm_hw_rev: 2
  - sm_fw_rev: 2
  - revision: 1

# Bit layouts for bitfields entries, referenced below with *name.
# PMBus STATUS_WORD, from the LGA80D datasheet (Rev 3.3, p.52); bits 8 and 10 are not used.
# zm_set_psmon sends 0xFFFF for no data, so NO_DATA (bit 8) is set only then: ignore the other
# bits of that row. LGA80D-specific: generic PMBus devices may set bit 8 (UNKNOWN).
pmbus_status_word: &pmbus_status_word
  NO_DATA: 0x0100
  VOUT: 0x8000
  IOUT: 0x4000
  INPUT: 0x2000
  MFR: 0x1000
  PGOOD_N: 0x0800
  OTHER: 0x0200
  BUSY: 0x0080
  "OFF": 0x0040 # quoted: YAML reads a bare OFF as false
  VOUT_OV: 0x0020
  IOUT_OC: 0x0010
  VIN_UV: 0x0008
  TEMPERATURE: 0x0004
  CML: 0x0002
  NONE_OF_ABOVE: 0x0001

# weird overwrites of address at location 0x00 so avoid that
# location, and start at 0x02 instead. Should figure this out
# eventually.
config:
  - name: firefly
    start: 2
    count: 160
    mcu_call: firefly_info
    mcu_extra_call: null
    type: uint16_t
    extra: Table=CM_FF_MON;Status=1
    default_col: null # if null, then column header
    names:
      - F1_P1_Tx12 
      - F1_P1_Rx12
      - F1_P2_Tx12 
      - F1_P2_Rx12
      - F1_P3_Tx12
      - F1_P3_Rx12 
      - F1_P4_Tx12
      - F1_P4_Rx12
      - F1_P5_XCVR4 
      - F1_P6_XCVR4
      - F2_P1_Tx12
      - F2_P1_Rx12 
      - F2_P2_Tx12 
      - F2_P2_Rx12 
      - F2_P3_Tx12 
      - F2_P3_Rx12 
      - F2_P4_Tx12
      - F2_P4_Rx12
      - F2_P5_XCVR4 
      - F2_P6_XCVR4
    postfixes: 
      - Temp_C
      - OptPow
      - TxDisabled
      - LOS_ALARM
      - CDR_LOL_ALARM
      - CDR_ENABLE
      - POWER_ALARM_R0
      - POWER_ALARM_R1
  - name: uptime
    start: 162
    count: 2
    type: uint32_t
    mcu_call: uptime
    mcu_extra_call: null
    extra: Table=CM_MON;Column=Minutes;Status=1
    default_col: null
    names:
      - MCU_UPTIME
  - name: psmon
    start: 164
    count: 84
    mcu_call: psmon
    mcu_extra_call: null
    type: fp16
    extra: Table=CM_MON;Status=2
    default_col: null
    names: 
      - 1V8
      - 3V3
      - F1VCCINT1_S1
      - F1VCCINT1_S2
      - F1VCCINT2_S1
      - F1VCCINT2_S2
      - F2VCCINT1_S1
      - F2VCCINT1_S2
      - F2VCCINT2_S1
      - F2VCCINT2_S2
      - F1AVTT
      - F1AVCC
      - F2AVTT
      - F2AVCC
    postfixes: 
      - TEMP1
      - TEMP3
      - VIN
      - VOUT
      - IOUT
      - STATUS_WORD
    # STATUS_WORD is a bit field: sent as the raw word (fp16 rounds values above 2048
    # and corrupts the low bits); 0xFFFF = no data (stale, supply off, read error).
    # postfix_types must match the PM_STATUS commands in zm_set_psmon.
    postfix_types:
      STATUS_WORD: uint16_t
    bitfields:
      STATUS_WORD:
        extra: Table=CM_MON_STATUS;Status=2
        fields: *pmbus_status_word
  - name: gitversion
    start: 248
    count: 10
    type: char
    size: 5
    mcu_call: gitversion
    mcu_extra_call: null
    default_col: null
    names:
      - MCU_FW_VER
  - name: adcmon
    start: 258
    count: 21
    mcu_call: adcmon
    mcu_extra_call: null
    default_col: ADC
    type: fp16
    extra: Table=CM_MON;Status=1
    names:
      - VCC_V120 
      - VCC_MV33
      - VCC_V33
      - VCC_V40 
      - VCC_V18
      - F1_VCCINT
      - F1_AVCC
      - F1_AVTT
      - F1_VCCAUX
      - F2_VCCINT
      - F2_AVCC 
      - F2_AVTT 
      - F2_VCCAUX
      - CUR_V_V12
      - CUR_V_MV33
      - CUR_V_V40
      - CUR_V_F1VCCAUX
      - CUR_V_F2VCCAUX
      - F1_TEMP
      - F2_TEMP
      - TM4C_TEMP
  - name: fpga
    start: 280
    count: 8
    type: fp16
    extra: Table=CM_MON;Status=2
    default_col: TEMP_C
    mcu_call: fpga
    mcu_extra_call: null
    names:
      - F1_TEMP_SLR0
      - F1_TEMP_SLR1
      - F1_TEMP_SLR2
      - F1_TEMP_SLR3
      - F2_TEMP_SLR0
      - F2_TEMP_SLR1
      - F2_TEMP_SLR2
      - F2_TEMP_SLR3
  - name: clkmon
    start: 288
    count: 35
    type: uint16_t
    extra: Table=CM_CLK_MON;Status=1
    mcu_call: clock
    mcu_extra_call: null
    default_col: null
    names: 
      - ROA
      - R0B
      - R1A
      - R1B
      - R1C
    postfixes:
      - PN_BASE
      - DEVICE_REV
      - I2C_ADDR
      - LOL
      - INT_STATUS
      - LOSOOF_IN
      - STICKY_FLG
  - name: clkr0aconfigversion
    start: 324
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 0
    names:
      - MCU_CLKR0A_VER
  - name: clkr0bconfigversion
    start: 328
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 1
    names:
      - MCU_CLKR0B_VER
  - name: clkr1aconfigversion
    start: 332
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 2
    names:
      - MCU_CLKR1A_VER
  - name: clkr1bconfigversion
    start: 336
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 3
    names:
      - MCU_CLKR1B_VER
  - name: clkr1cconfigversion
    start: 340
    count: 4
    type: char
    size: 2
    mcu_call: clkconfigversion
    default_col: null
    mcu_extra_call: 4
    names:
      - MCU_CLKR1C_VER
  - name: firefly_bits
    start: 344
    count: 8
    type: uint16_t
    extra: Table=CM_FFARGV_MON;Status=1
    default_col: null
    mcu_call: firefly_bits
    mcu_extra_call: null
    names:
      - F1_FFL12CH
      - F1_FFLDAQ
      - F2_FFL12CH
      - F2_FFLDAQ
    postfixes:
      - IS_FF25Gbs
      - IS_PRESENT      
  - name: firefly_optpow_12
    start: 352
    count: 96
    mcu_call: firefly_optpow12
    mcu_extra_call: null
    type: uint16_t
    extra: Table=CM_OPTPOW12_MON;Status=1
    default_col: null
    names:
      - FF1_P1_Rx12 
      - FF1_P2_Rx12 
      - FF1_P3_Rx12 
      - FF1_P4_Rx12 
      - FF2_P1_Rx12 
      - FF2_P2_Rx12 
      - FF2_P3_Rx12 
      - FF2_P4_Rx12
    postfixes:
      - CH0
      - CH1 
      - CH2
      - CH3
      - CH4
      - CH5
      - CH6
      - CH7
      - CH8
      - CH9
      - CH10
      - CH11
  - name: firefly_optpow_4
    start: 448
    count: 16
    mcu_call: firefly_optpow4
    mcu_extra_call: null
    type: uint16_t
    extra: Table=CM_OPTPOW4_MON;Status=1
    default_col: null
    names:
      - FF1_P5_XCVR4 
      - FF1_P6_XCVR4 
      - FF2_P5_XCVR4 
      - FF2_P6_XCVR4 
    postfixes:
      - CH0
      - CH1
      - CH2
      - CH3
  # Diagnostics block for fleet monitoring (TODO.md #26). diag_hdr, diag_reset_cause
  # and diag_pwr duplicate ProgCom pages 0x00/0x01 on purpose: the Zynq does not poll
  # ProgCom, so ZynqMon is its only path to monitoring. Uptime is MCU_UPTIME above.
  # A 32-bit block must hold exactly one name and start at an even address, or
  # xml_generate.py maps two values onto one word. Slot 537 is unused.
  # bitfields: name -> {field: mask within the value}; xml_generate.py adds a node per
  # field at the value's address, so the Zynq shows each field decoded (uint types only).
  - name: diag_hdr
    start: 512
    count: 2
    type: uint16_t
    mcu_call: diag_hdr
    mcu_extra_call: null
    extra: Table=CM_DIAG;Status=1
    default_col: VALUE
    names:
      - DIAG_SCHEMA
      - MCU_HEALTH
    bitfields:
      MCU_HEALTH: # MCU_HEALTH_* in MCU_Reg.h
        HEALTH_POWER_FAULT: 0x0001
        HEALTH_TEMPERATURE_ALARM: 0x0002
        HEALTH_VOLTAGE_ALARM: 0x0004
        HEALTH_ADC_ERROR: 0x0008
  - name: diag_reset_cause
    start: 514
    count: 2
    type: uint32_t
    mcu_call: diag_reset_cause
    mcu_extra_call: null
    extra: Table=CM_DIAG_RESET;Status=1
    default_col: VALUE
    names:
      - RESET_CAUSE
    bitfields:
      RESET_CAUSE: # SYSCTL_CAUSE_* in driverlib/sysctl.h
        RESET_EXT: 0x0001
        RESET_POR: 0x0002
        RESET_BOR: 0x0004
        RESET_WDOG0: 0x0008
        RESET_SW: 0x0010
        RESET_WDOG1: 0x0020
        RESET_HIB: 0x0040
        RESET_HSRVREQ: 0x1000
  - name: diag_pwr
    start: 516
    count: 6
    type: uint16_t
    mcu_call: diag_pwr
    mcu_extra_call: null
    extra: Table=CM_DIAG_PWR;Status=1
    default_col: VALUE
    names:
      - PWR_GENERATION
      - PWR_STATE_FLAGS
      - PWR_LIVE_MASK
      - PWR_EXPECTED_MASK
      - PWR_IGNORE_MASK
      - PWR_FAILED_MASK
    bitfields:
      PWR_STATE_FLAGS: # low byte: enum power_system_state (Tasks.h); high byte: PWR_FLAG_* (MCU_Reg.h)
        PWR_STATE: 0x00FF
        # the same byte as a name (Graphite gets the number); t_<value>_<name>_...,
        # names without '_', order as in Tasks.h
        PWR_STATE_NAME:
          mask: 0x00FF
          format: t_0_FAILURE_1_INIT_2_DOWN_3_OFF_4_L1ON_5_L2ON_6_L3ON_7_L4ON_8_L5ON_9_L6ON_10_ON_11_CONFIG
        PWR_BLADE_POWER_EN: 0x0100
        PWR_CLI_INHIBIT: 0x0200
        PWR_PROGCOM_INHIBIT: 0x0400
        PWR_FAULT_LATCH: 0x0800
        PWR_ALARM_SHUTDOWN_LATCH: 0x1000
        PWR_F1_ENABLE: 0x2000
        PWR_F2_ENABLE: 0x4000
  # order must match enum zm_stack_task in ZynqMonTask.h
  - name: diag_stack
    start: 522
    count: 15
    type: uint16_t
    mcu_call: diag_stack
    mcu_extra_call: null
    extra: Table=CM_DIAG_STACK;Status=1
    default_col: FREE_WORDS
    names:
      - STACK_POW
      - STACK_LED
      - STACK_CLIZY
      - STACK_ADC
      - STACK_FF_F1
      - STACK_FF_F2
      - STACK_CLK
      - STACK_PSMON
      - STACK_XIMON
      - STACK_I2CS0
      - STACK_EPRM
      - STACK_ZMON
      - STACK_TALM
      - STACK_VALM
      - STACK_PRGCM
  # Phase 2: why the previous boot ended, from the error log (errbuffer_find_prev_fatal):
  # its newest fatal entry (0 if none) and, for an assert, the PC. Slot 537 is unused.
  # A fatal entry ends in a SW reset (release builds), so PREV_FATAL with RESET_CAUSE
  # other than SW is suspect: the boot in between may have reset before logging its restart.
  - name: diag_prev_assert_pc
    start: 538
    count: 2
    type: uint32_t
    mcu_call: diag_prev_assert_pc
    mcu_extra_call: null
    extra: Table=CM_DIAG_RESET;Status=1
    default_col: VALUE
    names:
      - PREV_ASSERT_PC
  - name: diag_prev_fatal
    start: 540
    count: 1
    type: uint16_t
    mcu_call: diag_prev_fatal
    mcu_extra_call: null
    extra: Table=CM_DIAG_RESET;Status=1
    default_col: VALUE
    names:
      - PREV_FATAL_ENTRY
    bitfields:
      PREV_FATAL_ENTRY: # error log entry: counter, EBUF_* code, data (common/utils.h)
        PREV_FATAL_CODE: 0x1F00
        PREV_FATAL_NAME: # the code as a name
          mask: 0x1F00
          format: t_0_NONE_7_HARDFAULT_8_ASSERT_9_STACKOVF_21_MALLOC
        PREV_FATAL_DATA: 0x00FF
  # Phase 3: power failure counters (saturating) and the state POWER_FAILURE was last
  # entered from (0 = never). Slot 545 is unused (reserved for an LGA80D_init failure mask).
  - name: diag_pwr_fail
    start: 541
    count: 4
    type: uint16_t
    mcu_call: diag_pwr_fail
    mcu_extra_call: null
    extra: Table=CM_DIAG_PWR;Status=1
    default_col: VALUE
    names:
      - PWR_FAIL_STEP
      - PWR_SUPPLY_FAIL
      - PWR_ALARM_OFF
      - PWR_CONFIG_FAIL
    bitfields:
      PWR_FAIL_STEP:
        PWR_FAIL_STEP_NAME: # the state as a name; order as in Tasks.h
          mask: 0x00FF
          format: t_0_NONE_1_INIT_2_DOWN_3_OFF_4_L1ON_5_L2ON_6_L3ON_7_L4ON_8_L5ON_9_L6ON_10_ON_11_CONFIG
  # Phase 4: I2C master failure counters (saturating), buses 1-5: failed transfer
  # initiations, and non-NACK errors after a transfer (timeouts included)
  - name: diag_i2c
    start: 546
    count: 10
    type: uint16_t
    mcu_call: diag_i2c
    mcu_extra_call: null
    extra: Table=CM_DIAG_I2C;Status=1
    default_col: null
    names:
      - I2C1
      - I2C2
      - I2C3
      - I2C4
      - I2C5
    postfixes:
      - START_FAIL
      - ERROR
  # Phase 5: I2C slave (I2C0) diagnostics, counters saturate. The I2CS_SNAP_* values
  # describe the first duplicate DATA interrupt, i.e. are meaningful once I2CS_DUP_IRQ > 0.
  # I2CS_TIMEOUTS also counts a lone 1-byte write; I2CS_UNHANDLED also counts I2CSCSR = 0.
  - name: diag_i2cs
    start: 556
    count: 8
    type: uint16_t
    mcu_call: diag_i2cs
    mcu_extra_call: null
    extra: Table=CM_DIAG_I2CS;Status=1
    default_col: VALUE
    names:
      - I2CS_DUP_IRQ
      - I2CS_TIMEOUTS
      - I2CS_UNHANDLED
      - I2CS_LAST_UNHANDLED
      - I2CS_SNAP_INT
      - I2CS_SNAP_SCSR
      - I2CS_SNAP_STATE
      - I2CS_SNAP_TASK
    bitfields:
      I2CS_SNAP_STATE:
        I2CS_SNAP_STATE_NAME: # enum I2C_STATE in I2CSlaveTask.c
          mask: 0x00FF
          format: t_0_READY_1_FIRSTBYTE_2_RXB0_3_RXB1_4_TXB0_5_TXB1_255_NONE
      I2CS_SNAP_TASK:
        I2CS_SNAP_TASK_NAME: # enum zm_stack_task in ZynqMonTask.h
          mask: 0x00FF
          format: t_0_POW_1_LED_2_CLIZY_3_ADC_4_FFF1_5_FFF2_6_CLK_7_PSMON_8_XIMON_9_I2CS0_10_EPRM_11_ZMON_12_TALM_13_VALM_14_PRGCM_254_OTHER_255_NONE
  # Phase 6: LGA80D READ_TEMPERATURE_1 (BADT1_*) and _3 (BADT3_*) reads outside 0..175 C:
  # per sensor, saturating counts of 0xFFFF and of other bad words, and that sensor's latest
  # bad read (raw word and psmon row, ps * pages + page; row 255 = none yet)
  - name: diag_lga80d_badt
    start: 564
    count: 8
    type: uint16_t
    mcu_call: diag_lga80d_badt
    mcu_extra_call: null
    extra: Table=CM_DIAG_LGA80D;Status=1
    default_col: VALUE
    names:
      - LGA80D_BADT1_FFFF
      - LGA80D_BADT1_OTHER
      - LGA80D_BADT1_RAW
      - LGA80D_BADT1_ROW
      - LGA80D_BADT3_FFFF
      - LGA80D_BADT3_OTHER
      - LGA80D_BADT3_RAW
      - LGA80D_BADT3_ROW
    bitfields:
      LGA80D_BADT1_ROW:
        LGA80D_BADT1_ROW_NAME: # the psmon row names above, without '_'
          mask: 0x00FF
          format: t_0_1V8_1_3V3_2_F1VCCINT1S1_3_F1VCCINT1S2_4_F1VCCINT2S1_5_F1VCCINT2S2_6_F2VCCINT1S1_7_F2VCCINT1S2_8_F2VCCINT2S1_9_F2VCCINT2S2_10_F1AVTT_11_F1AVCC_12_F2AVTT_13_F2AVCC_255_NONE
      LGA80D_BADT3_ROW:
        LGA80D_BADT3_ROW_NAME:
          mask: 0x00FF
          format: t_0_1V8_1_3V3_2_F1VCCINT1S1_3_F1VCCINT1S2_4_F1VCCINT2S1_5_F1VCCINT2S2_6_F2VCCINT1S1_7_F2VCCINT1S2_8_F2VCCINT2S1_9_F2VCCINT2S2_10_F1AVTT_11_F1AVCC_12_F2AVTT_13_F2AVCC_255_NONE
